name: "Build & Release APK"

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/release-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.44.1"
          cache: true

      - run: flutter pub get

      # The same release key every time, so each new APK installs over the old one
      # and the phone keeps its settings. Without the secrets, Gradle falls back to the debug key.
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF

      - run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/repairwala-v1.0.${{ github.run_number }}.apk

      - name: Push to Releases
        uses: ncipollo/release-action@v1
        with:
          artifacts: "app/build/app/outputs/flutter-apk/repairwala-*.apk"
          tag: v1.0.${{ github.run_number }}
          name: Repairwala v1.0.${{ github.run_number }}
          body: "Android app for the shop phone. Install the APK, then set the laptop server address and shop token in सेटिंग."
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
